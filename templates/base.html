<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cleanifi - AI Data Cleaning{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
</head>

<body class="{{ 'dark-mode' if dark_mode else 'light-mode' }}">
    <!-- Immersive AI Ocean Background -->
    <div class="ocean-background">
        <svg class="ocean-svg" version="1.1" xmlns="http://www.w3.org/2000/svg"
            xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 24 150 28" preserveAspectRatio="none"
            shape-rendering="auto">
            <defs>
                <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
            </defs>
            <g class="wave-layers">
                <use xlink:href="#gentle-wave" x="48" y="0" class="wave wave1" />
                <use xlink:href="#gentle-wave" x="48" y="3" class="wave wave2" />
                <use xlink:href="#gentle-wave" x="48" y="5" class="wave wave3" />
                <use xlink:href="#gentle-wave" x="48" y="7" class="wave wave4" />
            </g>
        </svg>
        <div class="ocean-overlay"></div>
    </div>
    <div id="ripple-container"></div>

    <div class="app-container">
        {% block content %}{% endblock %}
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>

</html>
